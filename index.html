<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="CloudCompass - Accurate real-time weather forecasts and live air quality (AQI) monitoring with CPCB scale, PM2.5, PM10, 24-hour trends and neighborhood sensors." />
  <title>CloudCompass | Weather & Real-Time Air Quality Monitor</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("cloudcompass_theme");
        var theme = stored ? JSON.parse(stored) : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") {
          document.documentElement.className = "dark";
        } else {
          document.documentElement.className = "light";
        }
      } catch (e) {
        document.documentElement.className = "light";
      }
    })();
  </script>
</head>

<body class="m-0 font-sans antialiased text-gray-800">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
